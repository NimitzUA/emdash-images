name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: node scripts/release.mjs verify-tag "$GITHUB_REF_NAME"
      - run: printf '%s\n' 11.15.0 "$(npm --version)" | sort -V -C
      - id: registry
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$(npm view "@nimitzua/emdash-images@${version}" version 2>/dev/null)" = "$version" ]; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
        if: steps.registry.outputs.published == 'false'
      - run: npm stage publish
        if: steps.registry.outputs.published == 'false'
